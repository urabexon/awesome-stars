name: update starlog
on:
  workflow_dispatch:
  schedule:
    # 19:30 UTC is 4:30 JST
    - cron: '30 19 * * *'
jobs:
  starlog:
    name: update starlog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install starred==4.2.0
      - name: update repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: starred --username ${{ github.repository_owner }} --repository starlog --sort --token ${GITHUB_TOKEN} --message 'stars update by github actions cron'